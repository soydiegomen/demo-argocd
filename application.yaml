apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-argocd
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/soydiegomen/demo-argocd.git
    targetRevision: first-steps
    path: dev
  destination: 
    server: https://kubernetes.default.svc
    namespace: demo-argocd

  syncPolicy:
    syncOptions:
    - CreateNamespace=true

    automated:
      selfHeal: true
      prune: true
